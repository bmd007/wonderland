<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Hesab Ketab</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --bg-card: #fff;
            --bg-hover: #f8fafc;
            --bg-selected: #eff6ff;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-border: #2563eb;
            --green: #059669;
            --red: #dc2626;
            --input-border: #d1d5db;
            --input-bg: #fff;
            --btn-secondary-bg: #e2e8f0;
            --btn-secondary-text: #475569;
            --btn-secondary-hover: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.1);
            --event-debit-bg: #fee2e2;
            --event-debit-text: #dc2626;
            --event-credit-bg: #d1fae5;
            --event-credit-text: #059669;
            --notify-success-bg: #d1fae5;
            --notify-success-text: #065f46;
            --notify-success-border: #a7f3d0;
            --notify-error-bg: #fee2e2;
            --notify-error-text: #991b1b;
            --notify-error-border: #fca5a5;
            --notify-warn-bg: #fef3c7;
            --notify-warn-text: #92400e;
            --notify-warn-border: #fcd34d;
            --header-bg: #1e293b;
            --header-text: #fff;
            --header-sub: #94a3b8;
            --tab-active: var(--accent);
            --tab-inactive: var(--text-dim);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --bg-card: #1e293b;
                --bg-hover: #334155;
                --bg-selected: #1e3a5f;
                --text: #e2e8f0;
                --text-secondary: #cbd5e1;
                --text-muted: #94a3b8;
                --text-dim: #64748b;
                --border: #334155;
                --border-light: #1e293b;
                --accent: #3b82f6;
                --accent-hover: #2563eb;
                --accent-border: #3b82f6;
                --green: #34d399;
                --red: #f87171;
                --input-border: #475569;
                --input-bg: #0f172a;
                --btn-secondary-bg: #334155;
                --btn-secondary-text: #cbd5e1;
                --btn-secondary-hover: #475569;
                --shadow: rgba(0, 0, 0, 0.4);
                --event-debit-bg: #7f1d1d;
                --event-debit-text: #fca5a5;
                --event-credit-bg: #064e3b;
                --event-credit-text: #6ee7b7;
                --notify-success-bg: #064e3b;
                --notify-success-text: #6ee7b7;
                --notify-success-border: #065f46;
                --notify-error-bg: #7f1d1d;
                --notify-error-text: #fca5a5;
                --notify-error-border: #991b1b;
                --notify-warn-bg: #78350f;
                --notify-warn-text: #fcd34d;
                --notify-warn-border: #92400e;
                --header-bg: #020617;
                --header-text: #f1f5f9;
                --header-sub: #64748b;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--header-bg); color: var(--header-text); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header span { font-size: 0.85rem; color: var(--header-sub); }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.65rem; font-weight: 500; margin-left: 0.5rem; vertical-align: middle; background: #1e3a5f; color: #93c5fd; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .card { background: var(--bg-card); border-radius: 0.5rem; padding: 1.25rem; box-shadow: 0 1px 3px var(--shadow); }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-secondary); }
        .account-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-radius: 0.375rem; cursor: pointer; transition: background 0.15s; }
        .account-item:hover { background: var(--bg-hover); }
        .account-item.selected { background: var(--bg-selected); border-left: 3px solid var(--accent-border); }
        .account-name { font-weight: 500; }
        .account-balance { font-size: 1.1rem; font-weight: 600; color: var(--green); }
        .account-meta { font-size: 0.7rem; color: var(--text-dim); font-family: monospace; display: flex; gap: 0.75rem; }
        input, select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--input-border); border-radius: 0.375rem; font-size: 0.875rem; margin-bottom: 0.75rem; background: var(--input-bg); color: var(--text); }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.25rem; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.15s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }
        .btn-secondary:hover:not(:disabled) { background: var(--btn-secondary-hover); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .form-section { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); }
        .form-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .form-section h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-secondary); }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; padding: 0.5rem; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid var(--border); }
        td { padding: 0.5rem; border-bottom: 1px solid var(--border-light); }
        .event-type { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 500; }
        .event-MoneyDebited { background: var(--event-debit-bg); color: var(--event-debit-text); }
        .event-MoneyCredited { background: var(--event-credit-bg); color: var(--event-credit-text); }
        .detail-section { margin-top: 1.5rem; }
        .notification { position: fixed; top: 1rem; right: 1rem; padding: 0.75rem 1rem; border-radius: 0.375rem; font-size: 0.85rem; z-index: 100; animation: fadeIn 0.2s; max-width: 400px; }
        .notification.success { background: var(--notify-success-bg); color: var(--notify-success-text); border: 1px solid var(--notify-success-border); }
        .notification.error { background: var(--notify-error-bg); color: var(--notify-error-text); border: 1px solid var(--notify-error-border); }
        .notification.warn { background: var(--notify-warn-bg); color: var(--notify-warn-text); border: 1px solid var(--notify-warn-border); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-0.5rem); } to { opacity: 1; transform: translateY(0); } }
        .empty { text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.85rem; }
        .amount-neg { color: var(--red); }
        .amount-pos { color: var(--green); }
        .section-header { display: flex; justify-content: space-between; align-items: center; }
        .result-box { margin-top: 0.75rem; padding: 0.75rem; background: var(--bg-hover); border-radius: 0.375rem; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .info-text { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; }
        .inline-form { display: flex; gap: 0.5rem; align-items: flex-end; }
        .inline-form > div { flex: 1; }
    </style>
</head>
<body>
<header>
    <h1>Hesab Ketab</h1>
    <span>Event Sourced Ledger</span>
</header>

<div class="container">
    <div class="grid">
        <div class="card">
            <div class="section-header">
                <h2>Accounts <span class="badge">projection</span></h2>
                <button class="btn-secondary btn-sm" onclick="loadAccounts()">Refresh</button>
            </div>
            <div id="account-list"></div>
        </div>

        <div class="card">
            <div class="form-section">
                <h3>Open Account</h3>
                <label for="new-name">Name</label>
                <input id="new-name" onkeydown="if(event.key==='Enter')createAccount()" placeholder="Account holder name" type="text">
                <button class="btn-primary" onclick="createAccount()">Open Account</button>
            </div>
            <div class="form-section">
                <h3>Transfer</h3>
                <label for="transfer-from">From</label>
                <select id="transfer-from"></select>
                <label for="transfer-to">To</label>
                <select id="transfer-to"></select>
                <label for="transfer-amount">Amount</label>
                <input id="transfer-amount" min="0" onkeydown="if(event.key==='Enter')transfer()" placeholder="0.00" step="0.01" type="number">
                <button class="btn-primary" onclick="transfer()">Transfer</button>
            </div>
        </div>
    </div>

    <div class="detail-section">
        <div class="card">
            <div class="section-header">
                <h2 id="events-title">Event History</h2>
            </div>
            <label for="events-account">Account</label>
            <select id="events-account" onchange="selectAccount(this.value)">
                <option value="">Select an account</option>
            </select>
            <div id="events-panel">
                <div class="empty">Select an account to view events</div>
            </div>
        </div>
    </div>

    <div class="detail-section">
        <div class="grid">
            <div class="card">
                <h2>Time Travel</h2>
                <p class="info-text" style="margin-bottom:0.75rem">Replay events to see balance at any point in time</p>
                <label for="temporal-account">Account</label>
                <select id="temporal-account"></select>
                <label for="temporal-date">As of</label>
                <input id="temporal-date" type="datetime-local">
                <button class="btn-primary" onclick="queryBalanceAsOf()">Query Balance</button>
                <div id="temporal-result"></div>
            </div>
            <div class="card">
                <h2>Account Statement</h2>
                <p class="info-text" style="margin-bottom:0.75rem">Generate a statement with running balances from events</p>
                <label for="statement-account">Account</label>
                <select id="statement-account"></select>
                <div class="inline-form">
                    <div>
                        <label for="statement-from">From</label>
                        <input id="statement-from" type="datetime-local">
                    </div>
                    <div>
                        <label for="statement-to">To</label>
                        <input id="statement-to" type="datetime-local">
                    </div>
                </div>
                <button class="btn-primary" onclick="queryStatement()">Generate Statement</button>
                <div id="statement-result"></div>
            </div>
        </div>
    </div>
</div>

<script>
    var accounts = [];
    var selectedAccountId = null;
    var notificationCount = 0;

    function showNotification(msg, type) {
        notificationCount++;
        var el = document.createElement('div');
        el.className = 'notification ' + type;
        el.textContent = msg;
        el.style.top = (notificationCount * 0.5 + 0.5) + 'rem';
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); notificationCount--; }, 4000);
    }

    function fmt(n) {
        return Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function shortId(uuid) {
        return uuid ? uuid.substring(0, 8) : '';
    }

    function nameFor(id) {
        for (var i = 0; i < accounts.length; i++) {
            if (accounts[i].id === id) return accounts[i].name;
        }
        return shortId(id);
    }

    function formatTime(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    }

    function toLocalDatetime(date) {
        var d = new Date(date);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
    }

    function handleApiError(r) {
        if (!r.ok) return r.text().then(function (t) {
            try { var e = JSON.parse(t); throw e; } catch (ex) { if (ex.detail || ex.message) throw ex; throw {detail: t || 'Request failed'}; }
        });
        return r.json();
    }

    function showApiError(e, fallback) {
        showNotification(e.detail || e.message || fallback, 'error');
    }

    function loadAccounts() {
        fetch('/api/accounts').then(function (r) { return r.json(); })
            .then(function (data) { accounts = data; renderAccounts(); updateDropdowns(); })
            .catch(function (e) { console.error('Failed to load accounts', e); });
    }

    function renderAccounts() {
        var el = document.getElementById('account-list');
        if (accounts.length === 0) { el.innerHTML = '<div class="empty">No accounts yet</div>'; return; }
        var html = '';
        for (var i = 0; i < accounts.length; i++) {
            var a = accounts[i];
            var cls = a.id === selectedAccountId ? 'account-item selected' : 'account-item';
            html += '<div class="' + cls + '" onclick="selectAccount(\'' + a.id + '\')">' +
                '<div><div class="account-name">' + a.name + '</div>' +
                '<div class="account-meta"><span>' + shortId(a.id) + '</span><span>v' + a.version + '</span></div></div>' +
                '<div class="account-balance">' + fmt(a.balance) + '</div></div>';
        }
        el.innerHTML = html;
    }

    function updateDropdowns() {
        var html = '';
        for (var i = 0; i < accounts.length; i++) {
            var a = accounts[i];
            html += '<option value="' + a.id + '">' + a.name + ' (' + fmt(a.balance) + ')</option>';
        }
        document.getElementById('transfer-from').innerHTML = html;
        document.getElementById('transfer-to').innerHTML = html;
        document.getElementById('temporal-account').innerHTML = html;
        document.getElementById('statement-account').innerHTML = html;
        document.getElementById('events-account').innerHTML = '<option value="">Select an account</option>' + html;
        if (selectedAccountId) {
            setDropdownValue('temporal-account', selectedAccountId);
            setDropdownValue('statement-account', selectedAccountId);
        }
    }

    function setDropdownValue(id, value) {
        var el = document.getElementById(id);
        for (var i = 0; i < el.options.length; i++) {
            if (el.options[i].value === value) { el.selectedIndex = i; break; }
        }
    }

    function selectAccount(id) {
        if (!id) return;
        selectedAccountId = id;
        renderAccounts();
        setDropdownValue('temporal-account', id);
        setDropdownValue('statement-account', id);
        setDropdownValue('events-account', id);
        document.getElementById('events-title').textContent = 'Event History - ' + nameFor(id);
        document.getElementById('events-panel').innerHTML = '<div class="empty">Loading...</div>';
        fetch('/api/accounts/' + id + '/events')
            .then(function (r) { if (!r.ok) throw new Error('Status ' + r.status); return r.json(); })
            .then(renderEvents)
            .catch(function (e) { document.getElementById('events-panel').innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; });
    }

    function renderEvents(events) {
        var el = document.getElementById('events-panel');
        if (!events || events.length === 0) { el.innerHTML = '<div class="empty">No events</div>'; return; }
        var rows = '';
        var balance = 0;
        for (var i = 0; i < events.length; i++) {
            var e = events[i];
            var type = e['@type'] || 'Unknown';
            var detail = '';
            if (type === 'MoneyDebited') {
                balance -= Number(e.amount);
                detail = '<span class="event-type event-MoneyDebited">' + type + '</span> <span class="amount-neg">-' + fmt(e.amount) + '</span> <span style="color:var(--text-dim);font-size:0.7rem">txn ' + shortId(e.transactionId) + '</span>';
            } else if (type === 'MoneyCredited') {
                balance += Number(e.amount);
                detail = '<span class="event-type event-MoneyCredited">' + type + '</span> <span class="amount-pos">+' + fmt(e.amount) + '</span> <span style="color:var(--text-dim);font-size:0.7rem">txn ' + shortId(e.transactionId) + '</span>';
            } else {
                detail = type;
            }
            rows += '<tr><td>' + formatTime(e.occurredAt) + '</td><td>' + detail + '</td><td style="text-align:right;font-family:monospace">' + fmt(balance) + '</td></tr>';
        }
        el.innerHTML = '<table><thead><tr><th>When</th><th>Event</th><th style="text-align:right">Balance</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function createAccount() {
        var name = document.getElementById('new-name').value.trim();
        if (!name) { showNotification('Name is required', 'error'); return; }
        fetch('/api/accounts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        })
            .then(handleApiError)
            .then(function (account) {
                document.getElementById('new-name').value = '';
                showNotification('Account "' + account.name + '" created', 'success');
                refreshAfterMutation();
            })
            .catch(function (e) { showApiError(e, 'Failed to create account'); });
    }

    function transfer() {
        var from = document.getElementById('transfer-from').value;
        var to = document.getElementById('transfer-to').value;
        var amount = parseFloat(document.getElementById('transfer-amount').value);
        if (!from || !to || from === to) { showNotification('Select different accounts', 'error'); return; }
        if (!amount || amount <= 0) { showNotification('Enter a valid amount', 'error'); return; }
        fetch('/api/transactions', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({fromAccountId: from, toAccountId: to, amount: amount})
        })
            .then(handleApiError)
            .then(function () {
                document.getElementById('transfer-amount').value = '';
                showNotification('Transferred ' + fmt(amount) + ': ' + nameFor(from) + ' -> ' + nameFor(to), 'success');
                refreshAfterMutation();
            })
            .catch(function (e) { showApiError(e, 'Transfer failed'); });
    }

    function refreshAfterMutation() {
        setTimeout(loadAccounts, 500);
        setTimeout(loadAccounts, 2000);
        if (selectedAccountId) {
            setTimeout(function () { selectAccount(selectedAccountId); }, 500);
        }
    }

    function queryBalanceAsOf() {
        var id = document.getElementById('temporal-account').value;
        var dateStr = document.getElementById('temporal-date').value;
        if (!id) { showNotification('Select an account', 'error'); return; }
        if (!dateStr) { showNotification('Select a date/time', 'error'); return; }
        var asOf = new Date(dateStr).toISOString();
        var resultEl = document.getElementById('temporal-result');
        resultEl.innerHTML = '<div class="result-box" style="color:var(--text-dim)">Replaying events...</div>';
        fetch('/api/accounts/' + id + '/balance?asOf=' + encodeURIComponent(asOf))
            .then(handleApiError)
            .then(function (account) {
                resultEl.innerHTML =
                    '<div class="result-box">' +
                    '<div class="summary-row"><span>' + account.name + '</span><span class="account-balance">' + fmt(account.balance) + '</span></div>' +
                    '<div class="info-text">Balance as of ' + formatTime(asOf) + ' (replayed ' + account.version + ' events)</div></div>';
            })
            .catch(function (e) { resultEl.innerHTML = ''; showApiError(e, 'Time travel query failed'); });
    }

    function queryStatement() {
        var id = document.getElementById('statement-account').value;
        var fromStr = document.getElementById('statement-from').value;
        var toStr = document.getElementById('statement-to').value;
        if (!id) { showNotification('Select an account', 'error'); return; }
        if (!fromStr || !toStr) { showNotification('Select a date range', 'error'); return; }
        var from = new Date(fromStr).toISOString();
        var to = new Date(toStr).toISOString();
        var resultEl = document.getElementById('statement-result');
        resultEl.innerHTML = '<div class="result-box" style="color:var(--text-dim)">Generating statement...</div>';
        fetch('/api/accounts/' + id + '/statement?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to))
            .then(handleApiError)
            .then(function (stmt) {
                var html = '<div style="margin-top:0.75rem">' +
                    '<div class="summary-row" style="padding:0.5rem 0.75rem;background:var(--bg-hover);border-radius:0.375rem 0.375rem 0 0">' +
                    '<span>Opening: <strong>' + fmt(stmt.openingBalance) + '</strong></span>' +
                    '<span>Closing: <strong class="account-balance">' + fmt(stmt.closingBalance) + '</strong></span></div>';
                if (!stmt.entries || stmt.entries.length === 0) {
                    html += '<div class="empty" style="border:1px solid var(--border);border-top:none;border-radius:0 0 0.375rem 0.375rem">No transactions in this period</div>';
                } else {
                    var net = stmt.closingBalance - stmt.openingBalance;
                    var netClass = net >= 0 ? 'amount-pos' : 'amount-neg';
                    var netSign = net >= 0 ? '+' : '';
                    html += '<table style="border:1px solid var(--border);border-top:none"><thead><tr><th>When</th><th>Description</th><th style="text-align:right">Debit</th><th style="text-align:right">Credit</th><th style="text-align:right">Balance</th></tr></thead><tbody>';
                    for (var i = 0; i < stmt.entries.length; i++) {
                        var e = stmt.entries[i];
                        html += '<tr><td>' + formatTime(e.occurredAt) + '</td><td>' + e.description + '</td>' +
                            '<td style="text-align:right" class="amount-neg">' + (e.debit > 0 ? fmt(e.debit) : '') + '</td>' +
                            '<td style="text-align:right" class="amount-pos">' + (e.credit > 0 ? fmt(e.credit) : '') + '</td>' +
                            '<td style="text-align:right;font-family:monospace">' + fmt(e.runningBalance) + '</td></tr>';
                    }
                    html += '</tbody></table>';
                    html += '<div class="info-text" style="margin-top:0.5rem">Net change: <span class="' + netClass + '">' + netSign + fmt(net) + '</span> across ' + stmt.entries.length + ' transaction(s)</div>';
                }
                html += '</div>';
                resultEl.innerHTML = html;
            })
            .catch(function (e) { resultEl.innerHTML = ''; showApiError(e, 'Statement generation failed'); });
    }

    function initDateDefaults() {
        var now = new Date();
        document.getElementById('temporal-date').value = toLocalDatetime(now);
        document.getElementById('statement-to').value = toLocalDatetime(now);
        var thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        document.getElementById('statement-from').value = toLocalDatetime(thirtyDaysAgo);
    }

    loadAccounts();
    initDateDefaults();
</script>
</body>
</html>
