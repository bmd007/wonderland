<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesab Ketab</title>
    <style>
        :root {
            --bg: #f1f5f9; --bg-card: #fff; --bg-hover: #f8fafc; --bg-selected: #eff6ff;
            --text: #1e293b; --text-secondary: #475569; --text-muted: #64748b; --text-dim: #94a3b8;
            --border: #e2e8f0; --border-light: #f1f5f9;
            --accent: #2563eb; --accent-hover: #1d4ed8; --accent-border: #2563eb;
            --green: #059669; --red: #dc2626;
            --input-border: #d1d5db; --input-bg: #fff;
            --btn-secondary-bg: #e2e8f0; --btn-secondary-text: #475569; --btn-secondary-hover: #cbd5e1;
            --shadow: rgba(0,0,0,0.1);
            --event-open-bg: #dbeafe; --event-open-text: #1d4ed8;
            --event-deposit-bg: #d1fae5; --event-deposit-text: #059669;
            --event-debit-bg: #fee2e2; --event-debit-text: #dc2626;
            --status-completed-bg: #d1fae5; --status-completed-text: #059669;
            --status-pending-bg: #fef3c7; --status-pending-text: #d97706;
            --status-running-bg: #dbeafe; --status-running-text: #2563eb;
            --status-failed-bg: #fee2e2; --status-failed-text: #dc2626;
            --notify-success-bg: #d1fae5; --notify-success-text: #065f46; --notify-success-border: #a7f3d0;
            --notify-error-bg: #fee2e2; --notify-error-text: #991b1b; --notify-error-border: #fca5a5;
            --header-bg: #1e293b; --header-text: #fff; --header-sub: #94a3b8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a; --bg-card: #1e293b; --bg-hover: #334155; --bg-selected: #1e3a5f;
                --text: #e2e8f0; --text-secondary: #cbd5e1; --text-muted: #94a3b8; --text-dim: #64748b;
                --border: #334155; --border-light: #1e293b;
                --accent: #3b82f6; --accent-hover: #2563eb; --accent-border: #3b82f6;
                --green: #34d399; --red: #f87171;
                --input-border: #475569; --input-bg: #0f172a;
                --btn-secondary-bg: #334155; --btn-secondary-text: #cbd5e1; --btn-secondary-hover: #475569;
                --shadow: rgba(0,0,0,0.4);
                --event-open-bg: #1e3a5f; --event-open-text: #93c5fd;
                --event-deposit-bg: #064e3b; --event-deposit-text: #6ee7b7;
                --event-debit-bg: #7f1d1d; --event-debit-text: #fca5a5;
                --status-completed-bg: #064e3b; --status-completed-text: #6ee7b7;
                --status-pending-bg: #78350f; --status-pending-text: #fcd34d;
                --status-running-bg: #1e3a5f; --status-running-text: #93c5fd;
                --status-failed-bg: #7f1d1d; --status-failed-text: #fca5a5;
                --notify-success-bg: #064e3b; --notify-success-text: #6ee7b7; --notify-success-border: #065f46;
                --notify-error-bg: #7f1d1d; --notify-error-text: #fca5a5; --notify-error-border: #991b1b;
                --header-bg: #020617; --header-text: #f1f5f9; --header-sub: #64748b;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--header-bg); color: var(--header-text); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header span { font-size: 0.85rem; color: var(--header-sub); }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .card { background: var(--bg-card); border-radius: 0.5rem; padding: 1.25rem; box-shadow: 0 1px 3px var(--shadow); }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-secondary); }
        .account-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-radius: 0.375rem; cursor: pointer; transition: background 0.15s; }
        .account-item:hover { background: var(--bg-hover); }
        .account-item.selected { background: var(--bg-selected); border-left: 3px solid var(--accent-border); }
        .account-name { font-weight: 500; }
        .account-balance { font-size: 1.1rem; font-weight: 600; color: var(--green); }
        .account-id { font-size: 0.7rem; color: var(--text-dim); font-family: monospace; }
        input, select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--input-border); border-radius: 0.375rem; font-size: 0.875rem; margin-bottom: 0.75rem; background: var(--input-bg); color: var(--text); }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.25rem; }
        button { padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.15s; }
        .btn-primary { background: var(--accent); color: white; width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }
        .btn-secondary:hover { background: var(--btn-secondary-hover); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .form-section { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-light); }
        .form-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .form-section h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-secondary); }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; padding: 0.5rem; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid var(--border); }
        td { padding: 0.5rem; border-bottom: 1px solid var(--border-light); }
        .event-type { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 500; }
        .event-AccountOpened { background: var(--event-open-bg); color: var(--event-open-text); }
        .event-MoneyDeposited { background: var(--event-deposit-bg); color: var(--event-deposit-text); }
        .event-MoneyDebited { background: var(--event-debit-bg); color: var(--event-debit-text); }
        .event-MoneyCredited { background: var(--event-deposit-bg); color: var(--event-deposit-text); }
        .status { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 500; }
        .status-COMPLETED { background: var(--status-completed-bg); color: var(--status-completed-text); }
        .status-PENDING { background: var(--status-pending-bg); color: var(--status-pending-text); }
        .status-RUNNING { background: var(--status-running-bg); color: var(--status-running-text); }
        .status-FAILED { background: var(--status-failed-bg); color: var(--status-failed-text); }
        .detail-section { margin-top: 1.5rem; }
        .notification { position: fixed; top: 1rem; right: 1rem; padding: 0.75rem 1rem; border-radius: 0.375rem; font-size: 0.85rem; z-index: 100; animation: fadeIn 0.2s; }
        .notification.success { background: var(--notify-success-bg); color: var(--notify-success-text); border: 1px solid var(--notify-success-border); }
        .notification.error { background: var(--notify-error-bg); color: var(--notify-error-text); border: 1px solid var(--notify-error-border); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-0.5rem); } to { opacity: 1; transform: translateY(0); } }
        .empty { text-align: center; padding: 2rem; color: var(--text-dim); font-size: 0.85rem; }
        .amount-neg { color: var(--red); }
        .amount-pos { color: var(--green); }
        .task-header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header>
        <h1>Hesab Ketab</h1>
        <span>Event Sourced Ledger</span>
    </header>

    <div class="container">
        <div class="grid">
            <div class="card">
                <h2>Accounts</h2>
                <div id="account-list"></div>
            </div>

            <div class="card">
                <div class="form-section">
                    <h3>Open Account</h3>
                    <label for="new-name">Name</label>
                    <input type="text" id="new-name" placeholder="Account holder name">
                    <button class="btn-primary" onclick="createAccount()">Open Account</button>
                </div>
                <div class="form-section">
                    <h3>Deposit</h3>
                    <label for="deposit-account">Account</label>
                    <select id="deposit-account"></select>
                    <label for="deposit-amount">Amount</label>
                    <input type="number" id="deposit-amount" placeholder="0.00" step="0.01" min="0">
                    <button class="btn-primary" onclick="deposit()">Deposit</button>
                </div>
                <div class="form-section">
                    <h3>Transfer</h3>
                    <label for="transfer-from">From</label>
                    <select id="transfer-from"></select>
                    <label for="transfer-to">To</label>
                    <select id="transfer-to"></select>
                    <label for="transfer-amount">Amount</label>
                    <input type="number" id="transfer-amount" placeholder="0.00" step="0.01" min="0">
                    <button class="btn-primary" onclick="transfer()">Transfer</button>
                </div>
            </div>
        </div>

        <div class="detail-section">
            <div class="grid">
                <div class="card">
                    <h2 id="events-title">Event History</h2>
                    <div id="events-panel"><div class="empty">Select an account to view events</div></div>
                </div>
                <div class="card">
                    <h2 id="transfers-title">Transfers</h2>
                    <div id="transfers-panel"><div class="empty">Select an account to view transfers</div></div>
                </div>
            </div>
        </div>

        <div class="detail-section">
            <div class="grid">
                <div class="card">
                    <h2>Time Travel Query</h2>
                    <label for="temporal-account">Account</label>
                    <select id="temporal-account"></select>
                    <label for="temporal-date">Balance as of</label>
                    <input type="datetime-local" id="temporal-date">
                    <button class="btn-primary" onclick="queryBalanceAsOf()">Query</button>
                    <div id="temporal-result"></div>
                </div>
                <div class="card">
                    <h2>Account Statement</h2>
                    <label for="statement-account">Account</label>
                    <select id="statement-account"></select>
                    <label for="statement-from">From</label>
                    <input type="datetime-local" id="statement-from">
                    <label for="statement-to">To</label>
                    <input type="datetime-local" id="statement-to">
                    <button class="btn-primary" onclick="queryStatement()">Generate</button>
                    <div id="statement-result"></div>
                </div>
            </div>
        </div>

        <div class="detail-section">
            <div class="card">
                <div class="task-header">
                    <h2>Projection Tasks</h2>
                    <button class="btn-secondary btn-sm" onclick="triggerProjectionRebuild()">Rebuild All</button>
                </div>
                <div id="tasks-panel"><div class="empty">Loading...</div></div>
            </div>
        </div>
    </div>

<script>
let accounts = [];
let selectedAccountId = null;

function showNotification(msg, type) {
    var el = document.createElement('div');
    el.className = 'notification ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
}

function fmt(n) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function shortId(uuid) {
    if (!uuid) return '';
    return uuid.substring(0, 8);
}

function nameFor(id) {
    for (var i = 0; i < accounts.length; i++) {
        if (accounts[i].id === id) return accounts[i].name;
    }
    return shortId(id);
}

function formatTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function loadAccounts() {
    fetch('/api/accounts')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            accounts = data;
            renderAccounts();
            updateDropdowns();
        })
        .catch(function(e) {
            console.error('Failed to load accounts', e);
        });
}

function renderAccounts() {
    var el = document.getElementById('account-list');
    if (accounts.length === 0) {
        el.innerHTML = '<div class="empty">No accounts yet</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < accounts.length; i++) {
        var a = accounts[i];
        var cls = a.id === selectedAccountId ? 'account-item selected' : 'account-item';
        html += '<div class="' + cls + '" onclick="selectAccount(\'' + a.id + '\')">' +
            '<div>' +
            '<div class="account-name">' + a.name + '</div>' +
            '<div class="account-id">' + shortId(a.id) + '</div>' +
            '</div>' +
            '<div class="account-balance">' + fmt(a.balance) + '</div>' +
            '</div>';
    }
    el.innerHTML = html;
}

function updateDropdowns() {
    var html = '';
    for (var i = 0; i < accounts.length; i++) {
        var a = accounts[i];
        html += '<option value="' + a.id + '">' + a.name + ' (' + fmt(a.balance) + ')</option>';
    }
    document.getElementById('deposit-account').innerHTML = html;
    document.getElementById('transfer-from').innerHTML = html;
    document.getElementById('transfer-to').innerHTML = html;
    document.getElementById('temporal-account').innerHTML = html;
    document.getElementById('statement-account').innerHTML = html;
}

function selectAccount(id) {
    selectedAccountId = id;
    renderAccounts();
    var name = nameFor(id);
    document.getElementById('events-title').textContent = 'Event History - ' + name;
    document.getElementById('transfers-title').textContent = 'Transfers - ' + name;
    document.getElementById('events-panel').innerHTML = '<div class="empty">Loading events...</div>';
    document.getElementById('transfers-panel').innerHTML = '<div class="empty">Loading transfers...</div>';

    fetch('/api/accounts/' + id + '/events')
        .then(function(r) {
            if (!r.ok) throw new Error('Events API returned ' + r.status);
            return r.json();
        })
        .then(function(events) {
            renderEvents(events);
        })
        .catch(function(e) {
            console.error('Failed to load events', e);
            document.getElementById('events-panel').innerHTML = '<div class="empty">Error loading events: ' + e.message + '</div>';
        });

    fetch('/api/transactions/account/' + id)
        .then(function(r) {
            if (!r.ok) throw new Error('Transfers API returned ' + r.status);
            return r.json();
        })
        .then(function(transfers) {
            renderTransfers(transfers);
        })
        .catch(function(e) {
            console.error('Failed to load transfers', e);
            document.getElementById('transfers-panel').innerHTML = '<div class="empty">Error loading transfers: ' + e.message + '</div>';
        });
}

function renderEvents(events) {
    var el = document.getElementById('events-panel');
    if (!events || events.length === 0) {
        el.innerHTML = '<div class="empty">No events</div>';
        return;
    }
    var rows = '';
    for (var i = 0; i < events.length; i++) {
        var e = events[i];
        var type = e['@type'] || 'Unknown';
        var detail = '';
        if (type === 'AccountOpened') {
            detail = '<span class="event-type event-AccountOpened">' + type + '</span> ' + e.name;
        } else if (type === 'MoneyDeposited') {
            detail = '<span class="event-type event-MoneyDeposited">' + type + '</span> +' + fmt(e.amount);
        } else if (type === 'MoneyDebited') {
            detail = '<span class="event-type event-MoneyDebited">' + type + '</span> -' + fmt(e.amount) + ' (txn ' + shortId(e.transactionId) + ')';
        } else if (type === 'MoneyCredited') {
            detail = '<span class="event-type event-MoneyCredited">' + type + '</span> +' + fmt(e.amount) + ' (txn ' + shortId(e.transactionId) + ')';
        } else {
            detail = type;
        }
        rows += '<tr><td>' + formatTime(e.occurredAt) + '</td><td>' + detail + '</td></tr>';
    }
    el.innerHTML = '<table><thead><tr><th>When</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderTransfers(transfers) {
    var el = document.getElementById('transfers-panel');
    if (!transfers || transfers.length === 0) {
        el.innerHTML = '<div class="empty">No transfers</div>';
        return;
    }
    var rows = '';
    for (var i = 0; i < transfers.length; i++) {
        var t = transfers[i];
        var isOutgoing = t.fromAccountId === selectedAccountId;
        var amtClass = isOutgoing ? 'amount-neg' : 'amount-pos';
        var sign = isOutgoing ? '-' : '+';
        rows += '<tr>' +
            '<td>' + nameFor(t.fromAccountId) + '</td>' +
            '<td>' + nameFor(t.toAccountId) + '</td>' +
            '<td class="' + amtClass + '">' + sign + fmt(t.amount) + '</td>' +
            '<td>' + formatTime(t.occurredAt) + '</td>' +
            '</tr>';
    }
    el.innerHTML = '<table><thead><tr><th>From</th><th>To</th><th>Amount</th><th>When</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function loadTasks() {
    fetch('/api/tasks')
        .then(function(r) { return r.json(); })
        .then(function(tasks) {
            var el = document.getElementById('tasks-panel');
            if (!tasks || tasks.length === 0) {
                el.innerHTML = '<div class="empty">No tasks</div>';
                return;
            }
            var rows = '';
            var limit = Math.min(tasks.length, 20);
            for (var i = 0; i < limit; i++) {
                var t = tasks[i];
                rows += '<tr>' +
                    '<td>' + t.taskType + '</td>' +
                    '<td><span class="status status-' + t.status + '">' + t.status + '</span></td>' +
                    '<td>' + formatTime(t.scheduledAt) + '</td>' +
                    '<td>' + (t.errorMessage || '') + '</td>' +
                    '</tr>';
            }
            el.innerHTML = '<table><thead><tr><th>Type</th><th>Status</th><th>Scheduled</th><th>Error</th></tr></thead><tbody>' + rows + '</tbody></table>';
        })
        .catch(function(e) {
            console.error('Failed to load tasks', e);
        });
}

function createAccount() {
    var name = document.getElementById('new-name').value.trim();
    if (!name) { showNotification('Name is required', 'error'); return; }
    fetch('/api/accounts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name: name })
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw e; });
        return r.json();
    })
    .then(function() {
        document.getElementById('new-name').value = '';
        showNotification('Account "' + name + '" created', 'success');
        loadAccounts();
    })
    .catch(function(e) {
        showNotification(e.detail || 'Failed to create account', 'error');
    });
}

function deposit() {
    var id = document.getElementById('deposit-account').value;
    var amount = parseFloat(document.getElementById('deposit-amount').value);
    if (!id || !amount || amount <= 0) { showNotification('Select account and enter amount', 'error'); return; }
    fetch('/api/accounts/' + id + '/deposit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(amount)
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw e; });
        return r.json();
    })
    .then(function() {
        document.getElementById('deposit-amount').value = '';
        showNotification('Deposited ' + fmt(amount), 'success');
        loadAccounts();
        if (selectedAccountId === id) selectAccount(id);
    })
    .catch(function(e) {
        showNotification(e.detail || 'Deposit failed', 'error');
    });
}

function transfer() {
    var from = document.getElementById('transfer-from').value;
    var to = document.getElementById('transfer-to').value;
    var amount = parseFloat(document.getElementById('transfer-amount').value);
    if (!from || !to || from === to) { showNotification('Select different accounts', 'error'); return; }
    if (!amount || amount <= 0) { showNotification('Enter a valid amount', 'error'); return; }
    fetch('/api/transactions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ fromAccountId: from, toAccountId: to, amount: amount })
    })
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw e; });
        return r.json();
    })
    .then(function() {
        document.getElementById('transfer-amount').value = '';
        showNotification('Transferred ' + fmt(amount) + ' from ' + nameFor(from) + ' to ' + nameFor(to), 'success');
        loadAccounts();
        if (selectedAccountId) selectAccount(selectedAccountId);
        setTimeout(loadTasks, 1500);
    })
    .catch(function(e) {
        showNotification(e.detail || 'Transfer failed', 'error');
    });
}

function triggerProjectionRebuild() {
    fetch('/api/tasks/projection-rebuild', { method: 'POST' })
    .then(function() {
        showNotification('Projection rebuild scheduled', 'success');
        setTimeout(loadTasks, 2000);
    })
    .catch(function() {
        showNotification('Failed to trigger rebuild', 'error');
    });
}

function queryBalanceAsOf() {
    var id = document.getElementById('temporal-account').value;
    var dateStr = document.getElementById('temporal-date').value;
    if (!id || !dateStr) { showNotification('Select account and date', 'error'); return; }
    var asOf = new Date(dateStr).toISOString();
    fetch('/api/accounts/' + id + '/balance?asOf=' + encodeURIComponent(asOf))
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw e; });
        return r.json();
    })
    .then(function(account) {
        document.getElementById('temporal-result').innerHTML =
            '<div style="margin-top:0.75rem;padding:0.75rem;background:var(--bg-hover);border-radius:0.375rem">' +
            '<strong>' + account.name + '</strong> balance at ' + formatTime(asOf) +
            ': <span class="account-balance">' + fmt(account.balance) + '</span></div>';
    })
    .catch(function(e) {
        showNotification(e.detail || 'Query failed', 'error');
    });
}

function queryStatement() {
    var id = document.getElementById('statement-account').value;
    var fromStr = document.getElementById('statement-from').value;
    var toStr = document.getElementById('statement-to').value;
    if (!id || !fromStr || !toStr) { showNotification('Select account and date range', 'error'); return; }
    var from = new Date(fromStr).toISOString();
    var to = new Date(toStr).toISOString();
    fetch('/api/accounts/' + id + '/statement?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to))
    .then(function(r) {
        if (!r.ok) return r.json().then(function(e) { throw e; });
        return r.json();
    })
    .then(function(stmt) {
        var html = '<div style="margin-top:0.75rem">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;font-size:0.85rem">' +
            '<span>Opening: <strong>' + fmt(stmt.openingBalance) + '</strong></span>' +
            '<span>Closing: <strong>' + fmt(stmt.closingBalance) + '</strong></span></div>';
        if (!stmt.entries || stmt.entries.length === 0) {
            html += '<div class="empty">No transactions in period</div>';
        } else {
            html += '<table><thead><tr><th>When</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>';
            for (var i = 0; i < stmt.entries.length; i++) {
                var e = stmt.entries[i];
                html += '<tr>' +
                    '<td>' + formatTime(e.occurredAt) + '</td>' +
                    '<td>' + e.description + '</td>' +
                    '<td class="amount-neg">' + (e.debit > 0 ? fmt(e.debit) : '') + '</td>' +
                    '<td class="amount-pos">' + (e.credit > 0 ? fmt(e.credit) : '') + '</td>' +
                    '<td>' + fmt(e.runningBalance) + '</td></tr>';
            }
            html += '</tbody></table>';
        }
        html += '</div>';
        document.getElementById('statement-result').innerHTML = html;
    })
    .catch(function(e) {
        showNotification(e.detail || 'Statement failed', 'error');
    });
}

loadAccounts();
loadTasks();
</script>
</body>
</html>
